<!DOCTYPE html>
<html lang="ml-IN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മലയാളം ന്യൂസ് | Malayalam News Hub</title>
    <meta name="description" content="പ്രധാന മലയാളം വാർത്തകൾ - ലൈവ് ന്യൂസ് അഗ്രിഗേറ്റർ">

    <!-- Google Fonts: Noto Sans Malayalam + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        malayalam: ['Noto Sans Malayalam', 'sans-serif'],
                    },
                    colors: {
                        editorial: {
                            red: '#b91c1c',
                            redDark: '#991b1b',
                            paper: '#fafaf9',
                            charcoal: '#1f2937',
                            muted: '#6b7280',
                            border: '#e5e7eb',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                }
            }
        }
    </script>

    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-editorial-paper text-editorial-charcoal transition-colors duration-300 antialiased selection:bg-editorial-red selection:text-white"
      :class="{'dark': darkMode}"
      x-data="{ darkMode: false }">

    <!-- Dark mode class toggle via Alpine-like vanilla JS handled in app.js -->
    <div id="app">
        {% block content %}{% endblock %}
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
