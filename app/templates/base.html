<!DOCTYPE html>
<html lang="ml-IN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#b91c1c">
    <meta name="description" content="പ്രധാന മലയാളം വാർത്തകൾ - ലൈവ് ന്യൂസ് അഗ്രിഗേറ്റർ. കേരളം, ഇന്ത്യ, ലോകം, കായികം, സിനിമ, ടെക്നോളജി വാർത്തകൾ.">
    <meta property="og:site_name" content="മലയാളം ന്യൂസ് ഹബ്">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ml_IN">

    <title>മലയാളം ന്യൂസ് | Malayalam News Hub</title>

    <!-- Google Fonts: Noto Sans Malayalam + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        malayalam: ['Noto Sans Malayalam', 'sans-serif'],
                    },
                    colors: {
                        red: { DEFAULT: '#b91c1c', dark: '#991b1b', light: '#fef2f2' },
                    },
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-paper text-charcoal transition-colors duration-300 antialiased selection:bg-red selection:text-white"
      x-data="{ darkMode: false }">

    <div id="app">
        {% block content %}{% endblock %}
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
